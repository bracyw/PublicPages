<figure><img src="slides/01.svg" alt="Delphi"><figcaption><strong>Delphi</strong> Delphi is where NER keeps the context our coding agents work from: instructions, skills, docs and settings. This deck follows one workspace, argos-dev, and answers two questions: where does each thing in your checkout come from, and how does an improvement get back to everyone?</figcaption></figure>
<figure><img src="slides/02.svg" alt="A workspace is a folder on main, and a branch you clone"><figcaption><strong>A workspace is a folder on main, and a branch you clone</strong> Everything is stored once, on Delphi's main branch, as a folder per workspace under software/, laid out like the org chart. For each folder, CI keeps a branch, ws/&lt;name&gt;, whose repo root is that folder, so you clone the branch and the workspace's files sit at their normal places, with the skills it inherits from the folders above and Delphi's scripts added. The name is each folder's short name, from software/ down, then the workspace's own folder, joined by dots: s.app.argos.argos-dev.</figcaption></figure>
<figure><img src="slides/03.svg" alt="One small file says what a workspace pulls in"><figcaption><strong>One small file says what a workspace pulls in</strong> workspace.yml is the heart of a workspace. name and harness say which workspace it is and which agent it's for. plugins are harness plugin sets, like the delphi mod. park lists extra root folders that move aside with the workspace when you switch. The last three each check something out: repos are the code you change, references-git are dependency sources the agent reads, and workspaces are other Delphi workspaces (or main) to read. This is argos-dev's real file, trimmed, with URLs shortened.</figcaption></figure>
<figure><img src="slides/04.svg" alt="Each key turns into something in your clone"><figcaption><strong>Each key turns into something in your clone</strong> Two programs read workspace.yml. CI's ci/plugins.sh reads harness and plugins and writes .claude/settings.json, and setup.sh installs exactly the plugins it enables. Your own .delphi/setup.sh reads repos, references-git and workspaces and checks each out. Each repo gets a plain clone at repos/&lt;name&gt;, on its default branch, for working on one thing at a time, and separately a bare store at worktrees/&lt;name&gt;/.bare with the default branch checked out beside it, which agents' worktrees come from; each linked workspace is a full clone on its own branch, pulled and set up on every run. The checkout hook, park.sh, uses name and park to keep each workspace's folders apart when you switch. Everything setup makes is git-ignored, so code never shows up as a workspace change.</figcaption></figure>
<figure><img src="slides/05.svg" alt="Every file in your clone has one source"><figcaption><strong>Every file in your clone has one source</strong> This is the map to keep in your head. Gold files are the workspace's own: they live in its folder on main and you change them with a PR into ws/&lt;name&gt;. Purple files are inherited: the skills in each workspace-inherit/ folder above, which CI writes onto the branch on every sync, plus plugin sets like the delphi mod, which setup.sh installs. Change those on main. .delphi/ and the CI workflow are Delphi's machinery, shared by every workspace and changed only on main. settings.json is generated, never hand-edited. Dashed folders are made on your machine by setup.sh, and dotted ones are yours alone.</figcaption></figure>
<figure><img src="slides/06.svg" alt="Three ways context from above reaches a workspace"><figcaption><strong>Three ways context from above reaches a workspace</strong> Folders above a workspace can share context in three ways, and they behave differently. workspace-defaults/ is copied once when the workspace is created, then it's the workspace's own. workspace-inherit/ is one shared copy on main: on every sync CI writes its files onto the branch of every workspace below that folder, so a fix there reaches all of them, and a workspace that wants its own copy lists the path under opt-out:. Plugin sets are only for what files can't do, like the delphi mod. And with main under workspaces:, a workspace reads its project folder in a clone of main at workspaces/main/.</figcaption></figure>
<figure><img src="slides/07.svg" alt="A code change: skills from Delphi, code to Argos"><figcaption><strong>A code change: skills from Delphi, code to Argos</strong> A normal ticket. You clone the workspace and run setup once. Agents work in worktrees, all made from worktrees/argos/.bare; the plain clone at repos/argos is yours, for one thing at a time. /implement makes a worktree for the ticket's branch from origin/develop and works test-first; /run-local serves that worktree; /commit applies the message format; /open-pr runs the checks, offers screenshots or a video for a UI change, and opens a draft PR into Argos develop. The skills that guide every step are inherited from the argos and application-software folders on main, but the code goes through Argos's own PRs. worktrees/ is git-ignored, so Delphi never sees it.</figcaption></figure>
<figure><img src="slides/08.svg" alt="A context change: fix it once, every clone gets it"><figcaption><strong>A context change: fix it once, every clone gets it</strong> Say /implement missed a step. Park the thought with /journal, then fix the skill on a branch of ws/&lt;name&gt; and PR it into ws/&lt;name&gt;, reviewed like code. After it merges, CI proposes it to main as a PR from propose/&lt;name&gt;, filled from the PR template and labelled by: ai; check.sh runs on it. Merge that PR with a merge commit or squash, never a rebase. CI then refreshes every workspace branch, and teammates pick it up with git merge origin/ws/&lt;name&gt;. If the fix belongs to many workspaces, make it in a workspace-inherit/ folder on main instead.</figcaption></figure>
<figure><img src="slides/09.svg" alt="Two CI merges keep the folder and the branch in step"><figcaption><strong>Two CI merges keep the folder and the branch in step</strong> Both directions are subtree merges done by ci/sync.sh on every push to main or any ws/ branch. Refresh merges main into ws/&lt;name&gt; with the folder mapped to the root; propose does the reverse into propose/&lt;name&gt; and opens the PR. Because they're merges, histories stay joined and edits on both sides meet in a normal three-way merge. Sync also puts main's .delphi/ and each workspace's inherited files on its branch and regenerates settings.json, undoing hand edits to any of them.</figcaption></figure>
<figure><img src="slides/10.svg" alt="Need more in your workspace? Edit workspace.yml"><figcaption><strong>Need more in your workspace? Edit workspace.yml</strong> To pull something new in, edit workspace.yml (the setup-workspace skill knows the format) and re-run setup.sh; the new folders appear and stay git-ignored. A linked workspace is a full clone on its own branch, and setup runs its setup too, so its repos are there as well. Because workspace.yml is shared, PR the change into ws/&lt;name&gt; so teammates get it on their next setup. A plugin set takes effect once CI regenerates settings.json on the branch. For a one-off look, add the entry, run setup, then git restore workspace.yml. The entries here are examples.</figcaption></figure>
<figure><img src="slides/11.svg" alt="One clone, any workspace: /ws-delphi"><figcaption><strong>One clone, any workspace: /ws-delphi</strong> You don't need a clone per workspace. In Claude Code, /ws-delphi opens a pane of every workspace, grouped by project, with this clone's marked; pick one and press Switch workspace (or /ws-delphi --web for the same cards in a browser tab). It runs .delphi/switch.sh, which refuses while tracked files have changes, then the checkout hook parks this workspace's folders, its park: list included, in .delphi/parked/&lt;name&gt;/ and brings back the new one's. The new workspace's setup runs: migrations, repos, references, plugins. No restart: skills reload and the mod sends the new CLAUDE.md with your next prompt. The delphi plugin is enabled in every workspace; setup.sh installs it.</figcaption></figure>
<figure><img src="slides/12.svg" alt="Where do I change…?"><figcaption><strong>Where do I change…?</strong> When you're unsure where an edit belongs, find the row. The rule underneath: change a thing where it comes from. Workspace files through ws/&lt;name&gt;, shared context and machinery through main, code through its own repo, and personal settings nowhere at all.</figcaption></figure>
<figure><img src="slides/13.svg" alt="Try it"><figcaption><strong>Try it</strong> Three commands to a ready agent. Clone the workspace branch, run setup once, and start Claude Code at the root; the workspace's skills, glossary, repos and plugins are all there. Re-run setup after changing workspace.yml or pulling, and use /ws-delphi (or switch.sh) to move the same clone to another workspace or to main.</figcaption></figure>

    "notes": "This is the map to keep in your head. Gold files are the workspace's own: they live in its folder on main and you change them with a PR into ws/\u003cname>. Purple files are inherited: the skills in each workspace-inherit/ folder above, which CI writes onto the branch on every sync, plus plugin sets like the delphi mod, which setup.sh installs. Change those on main. .delphi/ and the CI workflow are Delphi's machinery, shared by every workspace and changed only on main. settings.json is generated, never hand-edited. Dashed folders are made on your machine by setup.sh, and dotted ones are yours alone."

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), img = $("slide");

  const thumbs = slides.map((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.innerHTML = `<img src="${s.src}" alt="" loading="lazy"><span><b>${i + 1}</b></span>`;
    b.querySelector("span").append(s.title);
    b.setAttribute("aria-label", `Slide ${i + 1}: ${s.title}`);
    b.addEventListener("click", () => { show(i); stage.scrollIntoView({ behavior: "smooth", block: "center" }); });
    li.append(b);
    $("toc").append(li);
    return b;
  });

  let cur = 0;
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[cur];
    img.src = s.src;
    img.alt = `${s.title}. ${s.notes}`;
    $("counter").textContent = `${cur + 1} / ${slides.length}`;
    $("kicker").textContent = s.kicker;
    $("title").textContent = s.title;
    $("text").textContent = s.notes;
    $("progress").style.width = `${((cur + 1) / slides.length) * 100}%`;
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === slides.length - 1;
    thumbs.forEach((b, j) => b.setAttribute("aria-current", String(j === cur)));
    history.replaceState(null, "", `#${cur + 1}`);
  }

  const full = () => (document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen?.());
  $("prev").addEventListener("click", () => show(cur - 1));
  $("next").addEventListener("click", () => show(cur + 1));
  $("full").addEventListener("click", full);
  // Click the left third to go back, anywhere else to go forward.
  stage.addEventListener("click", (e) => {
    const r = stage.getBoundingClientRect();
    show(e.clientX - r.left < r.width / 3 ? cur - 1 : cur + 1);
  });
  let x0 = null;
  stage.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
  stage.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { e.preventDefault(); show(cur + (dx < 0 ? 1 : -1)); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") full();
  });
  window.addEventListener("hashchange", () => show((parseInt(location.hash.slice(1), 10) || 1) - 1));

  slides.forEach((s) => { new Image().src = s.src; }); // so moving between slides is instant
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
