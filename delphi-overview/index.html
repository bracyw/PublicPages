<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delphi — Overview</title>
<style>
  :root {
    --ink: #1c2230;
    --sub: #5b6475;
    --line: #e4ded2;
    --gold: #c9932e;
    --paper: #f7f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 16px 80px; }

  h1 { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
  .subtitle { font-size: 17px; color: var(--sub); font-weight: 600; margin: 0 0 32px; }

  .stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--paper);
    aspect-ratio: 16 / 9;
  }
  .stage img { display: block; width: 100%; height: 100%; object-fit: contain; }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }
  button, .download {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, .download:hover { border-color: var(--gold); }
  button:disabled { opacity: 0.4; cursor: default; border-color: var(--line); }
  .counter { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
  .download { margin-left: auto; }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 28px;
  }
  .thumbs button { padding: 0; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: none; }
  .thumbs button[aria-current="true"] { border-color: var(--gold); }
  .thumbs img { display: block; width: 100%; }

  .hint { font-size: 13px; color: var(--sub); margin-top: 20px; }

  @media (max-width: 560px) {
    h1 { font-size: 32px; }
    .download { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Delphi</h1>
  <p class="subtitle">NER's AI context: organized by org chart, checked out like a repo.</p>

  <div class="stage"><img id="slide" src="slides/slide-1.png" alt=""></div>

  <div class="controls">
    <button id="prev" aria-label="Previous slide">&larr; Prev</button>
    <span class="counter" id="counter"></span>
    <button id="next" aria-label="Next slide">Next &rarr;</button>
    <a class="download" href="delphi-overview.pptx" download>Download .pptx</a>
  </div>

  <div class="thumbs" id="thumbs"></div>
  <p class="hint">Use the arrow keys to move between slides.</p>
</div>

<script>
  const titles = [
    "Delphi",
    "Overview: everything lives in one repo, by org chart",
    "Overview: check out a workspace, get a ready agent",
    "Why: real workflows outgrow single-repo skills",
    "Example workflow: one ticket, two things get better",
    "Internals 1/3: sync, a folder on main and a branch for you",
    "Internals 2/3: setup.sh, one manifest, three checkouts",
    "Internals 3/3: new workspaces, and keeping it all valid",
    "Try it: three commands to a ready agent",
  ];
  const src = (i) => `slides/slide-${i + 1}.png`;
  const img = document.getElementById("slide");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const thumbs = document.getElementById("thumbs");

  const buttons = titles.map((t, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `Slide ${i + 1}: ${t}`);
    b.innerHTML = `<img src="${src(i)}" alt="" loading="lazy">`;
    b.addEventListener("click", () => show(i));
    thumbs.appendChild(b);
    return b;
  });

  let cur = 0;
  function show(i) {
    cur = Math.max(0, Math.min(titles.length - 1, i));
    img.src = src(cur);
    img.alt = titles[cur];
    counter.textContent = `${cur + 1} / ${titles.length}`;
    prev.disabled = cur === 0;
    next.disabled = cur === titles.length - 1;
    buttons.forEach((b, j) => b.setAttribute("aria-current", String(j === cur)));
    history.replaceState(null, "", `#${cur + 1}`);
  }

  prev.addEventListener("click", () => show(cur - 1));
  next.addEventListener("click", () => show(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") show(cur + 1);
    if (e.key === "ArrowLeft" || e.key === "PageUp") show(cur - 1);
  });

  // Preload so slide changes are instant.
  titles.forEach((_, i) => { new Image().src = src(i); });
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
