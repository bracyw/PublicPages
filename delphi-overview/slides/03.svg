<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah-4F5869" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5869"/></marker><marker id="ah-B9821F" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9821F"/></marker><marker id="ah-2C6E72" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C6E72"/></marker><marker id="ah-7A4C86" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A4C86"/></marker><marker id="ah-7E8592" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E8592"/></marker><marker id="ah-1C2230" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-8D94A3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D94A3"/></marker></defs><rect width="1600" height="900" fill="#F7F4EE"/><rect x="80" y="58" width="15" height="15" fill="#B9821F"/><text x="108" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B9821F" text-anchor="start" letter-spacing="3.5" xml:space="preserve"><tspan>WORKSPACE.YML</tspan></text><text x="80" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>One small file says what a workspace pulls in</tspan></text><rect x="80" y="186" width="790" height="592" rx="14" fill="#202737" stroke="#202737" stroke-width="2"/><text x="108" y="228" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>workspace.yml</tspan></text><line x1="80" y1="248" x2="870" y2="248" stroke="#343C4E" stroke-width="2"/><text x="108" y="288" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">name:</tspan><tspan> s.app.argos.argos-dev</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="320" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">harness:</tspan><tspan> claude-code</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="352" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">plugins:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="384" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>delphi   </tspan><tspan fill="#8D94A3"># default, added by CI</tspan></text><text x="108" y="416" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">park:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="448" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>pictures</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="480" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>.playwright-cli</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="512" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">repos:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="544" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  argos:</tspan><tspan> …/Argos.git</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="576" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  odyssey-definitions:</tspan><tspan> …/Odyssey-Definitions.git</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="608" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">references-git:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="640" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  socketioxide:</tspan><tspan> …/socketioxide.git socketioxide-v0.18.7</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="672" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  zenoh:</tspan><tspan> …/zenoh.git 1.10.1</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="704" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">workspaces:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="736" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>main</tspan><tspan fill="#8D94A3"></tspan></text><path d="M 884 268 h 10 V 294 h -10" fill="none" stroke="#B9821F" stroke-width="3"/><polyline points="894,281 930,234" fill="none" stroke="#B9821F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="196" width="590" height="76" rx="8" fill="#F5E7C6" stroke="#B9821F" stroke-width="1.5"/><rect x="930" y="196" width="8" height="76" rx="4" fill="#B9821F"/><text x="956" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#B9821F" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">name:  </tspan><tspan font-weight="700">Which workspace this is</tspan></text><text x="956" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>its dotted name; the branch is ws/&lt;name&gt;</tspan></text><path d="M 884 300 h 10 V 326 h -10" fill="none" stroke="#2C6E72" stroke-width="3"/><polyline points="894,313 930,322" fill="none" stroke="#2C6E72" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="284" width="590" height="76" rx="8" fill="#D9EAE9" stroke="#2C6E72" stroke-width="1.5"/><rect x="930" y="284" width="8" height="76" rx="4" fill="#2C6E72"/><text x="956" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#2C6E72" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">harness:  </tspan><tspan font-weight="700">Which agent it's for</tspan></text><text x="956" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>claude-code: CI writes .claude/settings.json</tspan></text><path d="M 884 332 h 10 V 390 h -10" fill="none" stroke="#7A4C86" stroke-width="3"/><polyline points="894,361 930,410" fill="none" stroke="#7A4C86" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="372" width="590" height="76" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="930" y="372" width="8" height="76" rx="4" fill="#7A4C86"/><text x="956" y="406" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#7A4C86" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">plugins:  </tspan><tspan font-weight="700">Plugin sets from folders above</tspan></text><text x="956" y="434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI adds the defaults; setup.sh installs them</tspan></text><path d="M 884 396 h 10 V 486 h -10" fill="none" stroke="#1C2230" stroke-width="3"/><polyline points="894,441 930,498" fill="none" stroke="#1C2230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="460" width="590" height="76" rx="8" fill="#E3E5EA" stroke="#1C2230" stroke-width="1.5"/><rect x="930" y="460" width="8" height="76" rx="4" fill="#1C2230"/><text x="956" y="494" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#1C2230" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">park:  </tspan><tspan font-weight="700">Folders that switch with it</tspan></text><text x="956" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>moved to .delphi/parked/&lt;name&gt;/ while you're away</tspan></text><path d="M 884 492 h 10 V 582 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,537 930,586" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="548" width="590" height="76" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="582" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">repos:  </tspan><tspan font-weight="700">Code you change</tspan></text><text x="956" y="610" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>clone at repos/&lt;name&gt;; worktrees in worktrees/&lt;name&gt;/</tspan></text><path d="M 884 588 h 10 V 678 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,633 930,674" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="636" width="590" height="76" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="670" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">references-git:  </tspan><tspan font-weight="700">Dependency source to read</tspan></text><text x="956" y="698" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>references/&lt;name&gt;/, shallow, at the pin</tspan></text><path d="M 884 684 h 10 V 742 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,713 930,762" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="724" width="590" height="76" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">workspaces:  </tspan><tspan font-weight="700">Other workspaces to read</tspan></text><text x="956" y="786" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>a clone on its branch at workspaces/&lt;name&gt;/</tspan></text><text x="80" y="845" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">It's shared: </tspan><tspan>change it on a branch, PR it into ws/&lt;name&gt;, and everyone re-runs </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.delphi/setup.sh</tspan><tspan>.</tspan></text></svg>