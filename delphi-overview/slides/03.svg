<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah-4F5869" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5869"/></marker><marker id="ah-B9821F" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9821F"/></marker><marker id="ah-2C6E72" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C6E72"/></marker><marker id="ah-7A4C86" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A4C86"/></marker><marker id="ah-7E8592" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E8592"/></marker><marker id="ah-1C2230" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-8D94A3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D94A3"/></marker></defs><rect width="1600" height="900" fill="#F7F4EE"/><rect x="80" y="58" width="15" height="15" fill="#B9821F"/><text x="108" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B9821F" text-anchor="start" letter-spacing="3.5" xml:space="preserve"><tspan>WORKSPACE.YML</tspan></text><text x="80" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>One small file says what a workspace pulls in</tspan></text><rect x="80" y="186" width="790" height="588" rx="14" fill="#202737" stroke="#202737" stroke-width="2"/><text x="108" y="228" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>workspace.yml</tspan></text><line x1="80" y1="248" x2="870" y2="248" stroke="#343C4E" stroke-width="2"/><text x="108" y="288" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">name:</tspan><tspan> software/application-software/argos/argos-dev</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="322" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">harness:</tspan><tspan> claude-code</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="356" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">plugins:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="390" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>app    </tspan><tspan fill="#8D94A3"># default, added by CI</tspan></text><text x="108" y="424" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>argos  </tspan><tspan fill="#8D94A3"># default, added by CI</tspan></text><text x="108" y="458" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">repos:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="492" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  argos:</tspan><tspan> …/Argos.git</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="526" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  odyssey-definitions:</tspan><tspan> …/Odyssey-Definitions.git</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="560" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">references-git:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="594" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  socketioxide:</tspan><tspan> …/socketioxide.git socketioxide-v0.18.7</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="628" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  socket.io:</tspan><tspan> …/socket.io.git socket.io-client@4.8.1</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="662" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  zenoh:</tspan><tspan> …/zenoh.git 1.10.1</tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="696" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">workspaces:</tspan><tspan></tspan><tspan fill="#8D94A3"></tspan></text><text x="108" y="730" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan fill="#F2C46D">  - </tspan><tspan>main</tspan><tspan fill="#8D94A3"></tspan></text><path d="M 884 267 h 10 V 295 h -10" fill="none" stroke="#B9821F" stroke-width="3"/><polyline points="894,281 930,254" fill="none" stroke="#B9821F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="214" width="590" height="80" rx="8" fill="#F5E7C6" stroke="#B9821F" stroke-width="1.5"/><rect x="930" y="214" width="8" height="80" rx="4" fill="#B9821F"/><text x="956" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#B9821F" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">name:  </tspan><tspan font-weight="700">Which workspace this is</tspan></text><text x="956" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>its place in the tree; the branch is ws/&lt;name&gt;</tspan></text><path d="M 884 301 h 10 V 329 h -10" fill="none" stroke="#2C6E72" stroke-width="3"/><polyline points="894,315 930,350" fill="none" stroke="#2C6E72" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="310" width="590" height="80" rx="8" fill="#D9EAE9" stroke="#2C6E72" stroke-width="1.5"/><rect x="930" y="310" width="8" height="80" rx="4" fill="#2C6E72"/><text x="956" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#2C6E72" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">harness:  </tspan><tspan font-weight="700">Which agent it's for</tspan></text><text x="956" y="376" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>claude-code: CI writes .claude/settings.json</tspan></text><path d="M 884 335 h 10 V 431 h -10" fill="none" stroke="#7A4C86" stroke-width="3"/><polyline points="894,383 930,446" fill="none" stroke="#7A4C86" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="406" width="590" height="80" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="930" y="406" width="8" height="80" rx="4" fill="#7A4C86"/><text x="956" y="442" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#7A4C86" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">plugins:  </tspan><tspan font-weight="700">Shared skills from folders above</tspan></text><text x="956" y="472" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI lists the defaults; add other sets by hand</tspan></text><path d="M 884 437 h 10 V 533 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,485 930,542" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="502" width="590" height="80" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">repos:  </tspan><tspan font-weight="700">Code you change</tspan></text><text x="956" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>store in repos/&lt;name&gt;, checkouts in worktrees/</tspan></text><path d="M 884 539 h 10 V 669 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,604 930,638" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="598" width="590" height="80" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="634" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">references-git:  </tspan><tspan font-weight="700">Dependency source to read</tspan></text><text x="956" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>references/&lt;name&gt;/, shallow, at the pin</tspan></text><path d="M 884 675 h 10 V 737 h -10" fill="none" stroke="#4F5869" stroke-width="3"/><polyline points="894,706 930,734" fill="none" stroke="#4F5869" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="694" width="590" height="80" rx="8" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="956" y="730" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#4F5869" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">workspaces:  </tspan><tspan font-weight="700">Other Delphi branches to read</tspan></text><text x="956" y="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>linked/main/ or linked/ws/&lt;name&gt;/, read-only</tspan></text><text x="80" y="845" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">It's shared: </tspan><tspan>change it on a branch, PR it into ws/&lt;name&gt;, and everyone re-runs </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.delphi/setup.sh</tspan><tspan>.</tspan></text></svg>