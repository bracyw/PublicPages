<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah-4F5869" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5869"/></marker><marker id="ah-B9821F" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9821F"/></marker><marker id="ah-2C6E72" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C6E72"/></marker><marker id="ah-7A4C86" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A4C86"/></marker><marker id="ah-7E8592" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E8592"/></marker><marker id="ah-1C2230" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-8D94A3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D94A3"/></marker></defs><rect width="1600" height="900" fill="#F7F4EE"/><rect x="80" y="58" width="15" height="15" fill="#B9821F"/><text x="108" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B9821F" text-anchor="start" letter-spacing="3.5" xml:space="preserve"><tspan>WHERE THINGS COME FROM</tspan></text><text x="80" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Three ways context from above reaches a workspace</tspan></text><rect x="80" y="180" width="640" height="660" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><text x="108" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">main</tspan><tspan fill="#4F5869">   folders above argos-dev</tspan></text><text x="108" y="272" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>software/</tspan></text><line x1="120" y1="284" x2="120" y2="378" stroke="#D3CABA" stroke-width="2.5"/><line x1="120" y1="318" x2="136" y2="318" stroke="#D3CABA" stroke-width="2.5"/><rect x="142" y="296" width="550" height="44" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="142" y="296" width="8" height="44" rx="4" fill="#7A4C86"/><text x="162" y="326" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>workspace-inherit/</tspan></text><text x="404" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>→ journal, switch-workspace, …</tspan></text><line x1="120" y1="378" x2="136" y2="378" stroke="#D3CABA" stroke-width="2.5"/><text x="144" y="385" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>application-software/</tspan></text><line x1="156" y1="398" x2="156" y2="494" stroke="#D3CABA" stroke-width="2.5"/><line x1="156" y1="434" x2="172" y2="434" stroke="#D3CABA" stroke-width="2.5"/><rect x="178" y="412" width="514" height="44" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="178" y="412" width="8" height="44" rx="4" fill="#7A4C86"/><text x="198" y="442" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>workspace-inherit/</tspan></text><text x="440" y="441" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>→ commit, open-pr, …</tspan></text><line x1="156" y1="494" x2="172" y2="494" stroke="#D3CABA" stroke-width="2.5"/><text x="180" y="501" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>argos/</tspan></text><line x1="192" y1="514" x2="192" y2="712" stroke="#D3CABA" stroke-width="2.5"/><line x1="192" y1="550" x2="208" y2="550" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="528" width="478" height="44" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="214" y="528" width="8" height="44" rx="4" fill="#7A4C86"/><text x="234" y="558" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>workspace-inherit/</tspan></text><text x="476" y="557" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>→ implement, run-local</tspan></text><line x1="192" y1="606" x2="208" y2="606" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="584" width="478" height="44" rx="8" fill="#F5E7C6" stroke="#B9821F" stroke-width="1.5"/><rect x="214" y="584" width="8" height="44" rx="4" fill="#B9821F"/><text x="234" y="614" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>workspace-defaults/</tspan></text><text x="488" y="613" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#B9821F" text-anchor="start" xml:space="preserve"><tspan>→ copied at creation</tspan></text><line x1="192" y1="662" x2="208" y2="662" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="640" width="478" height="44" rx="8" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><text x="234" y="670" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>README · AUTHORING.md</tspan></text><line x1="192" y1="712" x2="208" y2="712" stroke="#D3CABA" stroke-width="2.5"/><text x="216" y="719" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>workspaces/</tspan></text><line x1="228" y1="732" x2="228" y2="772" stroke="#D3CABA" stroke-width="2.5"/><line x1="228" y1="772" x2="244" y2="772" stroke="#D3CABA" stroke-width="2.5"/><rect x="250" y="750" width="442" height="44" rx="8" fill="#1C2230" stroke="#1C2230" stroke-width="2"/><text x="270" y="780" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve"><tspan>argos-dev/</tspan></text><rect x="760" y="180" width="760" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="760" y="180" width="10" height="206" rx="5" fill="#B9821F"/><text x="796" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#B9821F" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">workspace-defaults/</tspan></text><text x="796" y="266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Copied once, when the workspace is made</tspan></text><text x="796" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>tools/new-workspace.sh copies templates/workspace/ plus the</tspan></text><text x="796" y="335" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>project's workspace-defaults/. Then the copy is the workspace's own.</tspan></text><rect x="760" y="406" width="760" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="760" y="406" width="10" height="206" rx="5" fill="#7A4C86"/><text x="796" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#7A4C86" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">workspace-inherit/</tspan></text><text x="796" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>One copy on main, on every branch below</tspan></text><text x="796" y="532" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Each sync, CI writes it onto every ws/* under that folder; an</tspan></text><text x="796" y="561" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>edit there is undone (list it under opt-out: to keep your own).</tspan></text><text x="796" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Plugin sets only carry what files can't: hooks, the delphi mod.</tspan></text><rect x="760" y="632" width="760" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="760" y="632" width="10" height="206" rx="5" fill="#1C2230"/><text x="796" y="678" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#1C2230" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">workspaces/main/</tspan></text><text x="796" y="718" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Read when needed, not edited from here</tspan></text><text x="796" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>With - main under workspaces:, setup.sh keeps a clone of main,</tspan></text><text x="796" y="787" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>pulled on every run: the project folder is at</tspan></text><text x="796" y="816" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>workspaces/main/software/…/argos/.</tspan></text></svg>