F" stroke="#D3CABA" stroke-width="2"/><text x="108" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">main</tspan><tspan fill="#4F5869">   folders above argos-dev</tspan></text><text x="108" y="280" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>software/</tspan></text><line x1="120" y1="292" x2="120" y2="330" stroke="#D3CABA" stroke-width="2.5"/><line x1="120" y1="330" x2="136" y2="330" stroke="#D3CABA" stroke-width="2.5"/><text x="144" y="337" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>application-software/</tspan></text><line x1="156" y1="350" x2="156" y2="640" stroke="#D3CABA" stroke-width="2.5"/><line x1="156" y1="386" x2="172" y2="386" stroke="#D3CABA" stroke-width="2.5"/><rect x="178" y="362" width="430" height="48" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="178" y="362" width="8" height="48" rx="4" fill="#7A4C86"/><text x="198" y="394" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>plugins/  </tspan></text><text x="330" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>→ app: create-ticket</tspan></text><line x1="156" y1="450" x2="172" y2="450" stroke="#D3CABA" stroke-width="2.5"/><text x="180" y="457" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>argos/</tspan></text><line x1="192" y1="470" x2="192" y2="760" stroke="#D3CABA" stroke-width="2.5"/><line x1="192" y1="505" x2="208" y2="505" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="481" width="394" height="48" rx="8" fill="#EEE3F1" stroke="#7A4C86" stroke-width="1.5"/><rect x="214" y="481" width="8" height="48" rx="4" fill="#7A4C86"/><text x="234" y="513" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>plugins/  </tspan></text><text x="366" y="513" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#7A4C86" text-anchor="start" xml:space="preserve"><tspan>→ argos: ticket-conventions</tspan></text><line x1="192" y1="569" x2="208" y2="569" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="545" width="394" height="48" rx="8" fill="#F5E7C6" stroke="#B9821F" stroke-width="1.5"/><rect x="214" y="545" width="8" height="48" rx="4" fill="#B9821F"/><text x="234" y="577" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>defaults/</tspan></text><text x="366" y="577" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#B9821F" text-anchor="start" xml:space="preserve"><tspan>→ copied at creation</tspan></text><line x1="192" y1="633" x2="208" y2="633" stroke="#D3CABA" stroke-width="2.5"/><rect x="214" y="609" width="394" height="48" rx="8" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><text x="234" y="641" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>README · AUTHORING.md</tspan></text><line x1="192" y1="697" x2="208" y2="697" stroke="#D3CABA" stroke-width="2.5"/><text x="216" y="704" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>workspaces/</tspan></text><line x1="228" y1="716" x2="228" y2="756" stroke="#D3CABA" stroke-width="2.5"/><line x1="228" y1="756" x2="244" y2="756" stroke="#D3CABA" stroke-width="2.5"/><rect x="250" y="732" width="358" height="48" rx="8" fill="#1C2230" stroke="#1C2230" stroke-width="2"/><text x="270" y="764" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve"><tspan>argos-dev/</tspan></text><rect x="690" y="180" width="830" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="690" y="180" width="10" height="206" rx="5" fill="#B9821F"/><text x="728" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#B9821F" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">defaults/</tspan></text><text x="728" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Copied once, when the workspace is made</tspan></text><text x="728" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>tools/new-workspace.sh copies templates/workspace/ plus the</tspan></text><text x="728" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>project's defaults/. After that the copy is the workspace's own.</tspan></text><rect x="690" y="406" width="830" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="690" y="406" width="10" height="206" rx="5" fill="#7A4C86"/><text x="728" y="456" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#7A4C86" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">plugins/claude/&lt;set&gt;/</tspan></text><text x="728" y="498" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>One shared copy, always current</tspan></text><text x="728" y="542" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI lists each folder's default set under plugins: and enables it;</tspan></text><text x="728" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Claude Code installs it from main and auto-updates it.</tspan></text><rect x="690" y="632" width="830" height="206" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="690" y="632" width="10" height="206" rx="5" fill="#1C2230"/><text x="728" y="682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan fill="#1C2230" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">linked/main/</tspan></text><text x="728" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Read when needed, never edited</tspan></text><text x="728" y="768" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>With - main under workspaces:, setup.sh keeps a read-only copy;</tspan></text><text x="728" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>the project folder is linked/main/software/…/argos/.</tspan></text></svg>