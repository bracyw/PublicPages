oke="#D3CABA" stroke-width="2"/><circle cx="118" cy="252" r="19" fill="#B9821F"/><text x="118" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>1</tspan></text><text x="150" y="261" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Notice a gap</tspan></text><text x="108" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>a skill missed a step:</tspan></text><text x="108" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>park it with /journal</tspan></text><rect x="580" y="210" width="440" height="150" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="618" cy="252" r="19" fill="#B9821F"/><text x="618" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>2</tspan></text><text x="650" y="261" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Fix it on a branch</tspan></text><text x="608" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>branch off ws/&lt;name&gt;; edit</tspan></text><text x="608" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>.claude/skills/, CLAUDE.md, docs/</tspan></text><rect x="1080" y="210" width="440" height="150" rx="10" fill="#FFFFFF" 