"#D3CABA" stroke-width="2"/><circle cx="618" cy="512" r="19" fill="#B9821F"/><text x="618" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>5</tspan></text><text x="650" y="521" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Merge into main</tspan></text><text x="608" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>merge commit or squash,</tspan></text><text x="608" y="598" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>never rebase</tspan></text><rect x="80" y="470" width="440" height="150" rx="10" fill="#FFFFFF" stroke="#2C6E72" stroke-width="2.5"/><circle cx="118" cy="512" r="19" fill="#2C6E72"/><text x="118" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>6</tspan></text><text x="150" y="521" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>CI refreshes</tspan></text><text x="108" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>every ws/* branch gets it;</tspan></text><text x="108" y="598" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>you: git merge origin/ws/&lt;name&gt;</tspan></text><polyline points="526,285 572,285" fill="none" stroke="#4F5869" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><polyline points="1026,285 1072,285" fill="none" stroke="#4F5869" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><polyline points="1300,366 1300,462" fill="none" stroke="#2C6E72" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2C6E72)"/><polyline points="1074,545 1028,545" fill="none" stroke="#4F5869" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><polyline points="574,545 528,545" fill="none" stroke="#2C6E72" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2C6E72)"/><text x="80" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4F5869" text-anchor="start" letter-spacing="2" xml:space="preserve"><tspan>IN YOUR WORKSPACE</tspan></text><text x="80" y="454" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4F5869" text-anchor="start" letter-spacing="2" xml:space="preserve"><tspan>ON MAIN, THEN BACK TO EVERY WORKSPACE</tspan></text><rect x="80" y="680" width="710" height="150" rx="10" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><text x="108" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Shared by many workspaces?</tspan></text><text x="108" y="764" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Put it in a plugin set or the project folder instead:</tspan></text><text x="108" y="794" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>one PR to main.</tspan></text><rect x="810" y="680" width="710" height="150" rx="10" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><text x="838" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Conflict with main?</tspan></text><text x="838" y="764" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI lists the files and skips that workspace; fix it in a</tspan></text><text x="838" y="794" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR into ws/&lt;name&gt;.</tspan></text></svg>