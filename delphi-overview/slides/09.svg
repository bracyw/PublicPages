r="middle" xml:space="preserve"><tspan>edit · commit · PR</tspan></text><polyline points="380,312 230,462" fill="none" stroke="#2C6E72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2C6E72)"/><text x="150" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C6E72" text-anchor="start" xml:space="preserve"><tspan>refresh</tspan></text><text x="150" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#2C6E72" text-anchor="start" xml:space="preserve"><tspan>CI</tspan></text><polyline points="448,522 552,522" fill="none" stroke="#2C6E72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2C6E72)"/><text x="500" y="506" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C6E72" text-anchor="middle" xml:space="preserve"><tspan>propose</tspan></text><polyline points="740,462 600,312" fill="none" stroke="#4F5869" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><text x="700" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>merge PR</tspan></text><text x="700" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>after check.sh</tspan></text><polyline points="200,582 200,692" fill="none" stroke="#4F5869" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><text x="188" y="642" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="end" xml:space="preserve"><tspan>branch</tspan></text><polyline points="320,692 320,582" fill="none" stroke="#4F5869" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-4F5869)"/><text x="334" y="642" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR</tspan></text><text x="560" y="680" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>git merge -Xsubtree=&lt;folder&gt;</tspan></text><text x="560" y="712" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>both ways, so histories stay joined</tspan></text><rect x="1000" y="200" width="6" height="122" rx="3" fill="#B9821F"/><text x="1030" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Refresh</tspan></text><text x="1030" y="266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Each push to main is merged into every</tspan></text><text x="1030" y="296" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>ws/&lt;name&gt;, folder becoming root.</tspan></text><rect x="1000" y="352" width="6" height="122" rx="3" fill="#B9821F"/><text x="1030" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Propose</tspan></text><text x="1030" y="418" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Merged workspace changes become a PR to</tspan></text><text x="1030" y="448" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>main from propose/&lt;name&gt;.</tspan></text><rect x="1000" y="504" width="6" height="122" rx="3" fill="#B9821F"/><text x="1030" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>One copy of the machinery</tspan></text><text x="1030" y="570" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Sync puts main's .delphi/ and inherited</tspan></text><text x="1030" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>files on every branch, and regenerates</tspan></text><text x="1030" y="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>settings.json.</tspan></text><rect x="1000" y="656" width="6" height="122" rx="3" fill="#B9821F"/><text x="1030" y="686" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Conflicts are reported</tspan></text><text x="1030" y="722" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI lists the files and skips that</tspan></text><text x="1030" y="752" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>workspace; a person resolves it.</tspan></text></svg>