FFF" text-anchor="middle" xml:space="preserve"><tspan>2</tspan></text><text x="896" y="387" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Re-run .delphi/setup.sh</tspan></text><text x="896" y="423" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>the new folders appear in your clone</tspan></text><rect x="820" y="468" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="862" cy="514" r="19" fill="#B9821F"/><text x="862" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>3</tspan></text><text x="896" y="523" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>PR it into ws/&lt;name&gt;</tspan></text><text x="896" y="559" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>teammates get it on their next setup.sh</tspan></text><rect x="820" y="604" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="862" cy="650" r="19" fill="#B9821F"/><text x="862" y="658" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>4</tspan></text><text x="896" y="659" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Plugin sets: CI does the rest</tspan></text><text x="896" y="695" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>after the merge it regenerates .claude/settings.json</tspan></text><rect x="80" y="760" width="1440" height="82" rx="10" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><text x="108" y="810" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Just looking? </tspan><tspan>Add the entry, run setup, then </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">git restore workspace.yml</tspan><tspan>.   Another workspace? </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.delphi/switch.sh &lt;name&gt;</tspan></text></svg>