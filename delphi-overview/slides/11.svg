-width="2"/><text x="108" y="228" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>/ws-delphi</tspan></text><line x1="80" y1="248" x2="720" y2="248" stroke="#343C4E" stroke-width="2"/><text x="108" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>application-software</tspan></text><rect x="108" y="298" width="284" height="44" rx="8" fill="#2A3245" stroke="#3A4255" stroke-width="1.5"/><text x="126" y="327" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">hub</tspan><tspan fill="#9FD4A3" font-weight="400">  · current</tspan></text><text x="108" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>application-software / argos</tspan></text><rect x="108" y="384" width="284" height="44" rx="8" fill="#3A3220" stroke="#B9821F" stroke-width="2.5"/><text x="126" y="413" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">argos-dev</tspan></text><rect x="408" y="384" width="284" height="44" rx="8" fill="#2A3245" stroke="#3A4255" stroke-width="1.5"/><text x="426" y="413" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">experimental</tspan></text><text x="108" y="456" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>application-software / nero</tspan></text><rect x="108" y="470" width="284" height="44" rx="8" fill="#2A3245" stroke="#3A4255" stroke-width="1.5"/><text x="126" y="499" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">nero-experimental</tspan></text><text x="108" y="542" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>firmware / calypso</tspan></text><rect x="108" y="556" width="284" height="44" rx="8" fill="#2A3245" stroke="#3A4255" stroke-width="1.5"/><text x="126" y="585" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">calypso-dev</tspan></text><text x="108" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>project folders, templates, CI</tspan></text><rect x="108" y="642" width="284" height="44" rx="8" fill="#2A3245" stroke="#3A4255" stroke-width="1.5"/><text x="126" y="671" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#E8E3D8" text-anchor="start" xml:space="preserve"><tspan font-weight="700">main</tspan></text><rect x="108" y="760" width="300" height="52" rx="8" fill="#B9821F" stroke="#B9821F" stroke-width="2"/><text x="258" y="794" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve"><tspan>Switch workspace</tspan></text><text x="430" y="794" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8D94A3" text-anchor="start" xml:space="preserve"><tspan>or Open in browser</tspan></text><rect x="780" y="186" width="740" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="822" cy="232" r="19" fill="#B9821F"/><text x="822" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>1</tspan></text><text x="856" y="241" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Checks you're clean</tspan></text><text x="856" y="277" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>refuses while tracked files have changes</tspan></text><rect x="780" y="322" width="740" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="822" cy="368" r="19" fill="#B9821F"/><text x="822" y="376" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>2</tspan></text><text x="856" y="377" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Parks this workspace</tspan></text><text x="856" y="413" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>its folders + park: list go to .delphi/parked/&lt;name&gt;/</tspan></text><rect x="780" y="458" width="740" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="822" cy="504" r="19" fill="#B9821F"/><text x="822" y="512" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>3</tspan></text><text x="856" y="513" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Sets up the new one</tspan></text><text x="856" y="549" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>migrations, repos, references, its plugins</tspan></text><rect x="780" y="594" width="740" height="118" rx="10" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><circle cx="822" cy="640" r="19" fill="#B9821F"/><text x="822" y="648" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan>4</tspan></text><text x="856" y="649" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>No restart</tspan></text><text x="856" y="685" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>skills reload; the next prompt gets the new CLAUDE.md</tspan></text><text x="780" y="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Without the mod: </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.delphi/switch.sh &lt;name&gt;|main</tspan></text><text x="780" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan font-weight="700">List them: </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.delphi/switch.sh --list</tspan></text><text x="780" y="836" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>Branches of one workspace move nothing; parked work is ignored, not lost.</tspan></text></svg>