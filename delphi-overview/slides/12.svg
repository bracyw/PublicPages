xt><text x="1110" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR into ws/&lt;name&gt;; re-run setup</tspan></text><rect x="80" y="370" width="1440" height="66" rx="8" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="80" y="370" width="10" height="66" rx="4" fill="#2C6E72"/><text x="110" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Turn on another plugin set</tspan></text><text x="580" y="412" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>workspace.yml  plugins:</tspan></text><text x="1110" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>CI regenerates settings.json</tspan></text><rect x="80" y="448" width="1440" height="66" rx="8" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><rect x="80" y="448" width="10" height="66" rx="4" fill="#7A4C86"/><text x="110" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Share a skill with many workspaces</tspan></text><text x="580" y="490" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>software/…/workspace-inherit/</tspan></text><text x="1110" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR to main; CI writes it below</tspan></text><rect x="80" y="526" width="1440" height="66" rx="8" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="80" y="526" width="10" height="66" rx="4" fill="#B9821F"/><text x="110" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Change what new workspaces start with</tspan></text><text x="580" y="568" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>…/&lt;project&gt;/workspace-defaults/</tspan></text><text x="1110" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR to main (switch to main)</tspan></text><rect x="80" y="604" width="1440" height="66" rx="8" fill="#F7F4EE" stroke="#D3CABA" stroke-width="2"/><rect x="80" y="604" width="10" height="66" rx="4" fill="#1C2230"/><text x="110" y="646" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>Change setup, switch, park scripts</tspan></text><text x="580" y="646" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>.delphi/  on main</tspan></text><text x="1110" y="646" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4F5869" text-anchor="start" xml:space="preserve"><tspan>PR to main + version bump</tspan></text><rect x="80" y="682" width="1440" height="66" rx="8" fill="#FFFFFF" stroke="#D3CABA" stroke-width="2"/><rect x="80" y="682" width="10" height="66" rx="4" fill="#FFFFFF" stroke="#4F5869" stroke-width="2" stroke-dasharray="7 5"/><text x="110" y="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve"><tspan>